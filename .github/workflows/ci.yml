name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21" ]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # `verify` runs the JUnit 5 suite (incl. the Redis binding conformance test)
      # and the JaCoCo >=90% line-coverage gate. Tests mock the Redis command seam —
      # no Redis, no network — so they run in the same job as the build.
      - name: Test
        run: mvn -B --no-transfer-progress verify

  conformance:
    name: Conformance suite in sync
    runs-on: ubuntu-latest
    env:
      BQ_CONFORMANCE_VERSION: 1.5.0
    steps:
      - uses: actions/checkout@v5
      - name: Verify vendored conformance matches the pinned release asset
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          bash "$RUNNER_TEMP/fetch.sh" --check "$BQ_CONFORMANCE_VERSION" "src/test/resources/conformance"

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [test, conformance]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
